{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Create your account</h1>
  <form method="post" novalidate>
    {{ m.csrf() }}
    <label for="name">Full name</label>
    <input type="text" id="name" name="name" value="{{ form.name }}" maxlength="100" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ form.email }}" maxlength="254" required>

    <label for="password">Password <span class="muted small">(at least 8 characters)</span></label>
    <input type="password" id="password" name="password" minlength="8" required>

    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>

    <button type="submit" class="btn" id="register-button">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</section>
{% endblock %}
